name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run quality gates
        run: ./gradlew clean checkstyleMain checkstyleTest spotbugsMain spotbugsTest test jacocoTestReport

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/checkstyle
            build/reports/spotbugs
            build/reports/tests/test
            build/reports/jacoco/test/html

      - name: Build Docker image
        run: |
          ./gradlew bootJar
          docker build -t lecture-management-api .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Trigger Railway deploy
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RAILWAY_DEPLOY_HOOK_URL" ]; then
            echo "RAILWAY_DEPLOY_HOOK_URL secret is missing."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RAILWAY_DEPLOY_HOOK_URL"
